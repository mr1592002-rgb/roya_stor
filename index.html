/div></main><nav><button onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂<small>الرئيسية</small></button><button onclick="toast('السلة جاهزة للربط بالمنتجات')">🛒<small>السلة</small></button><button onclick="toast('أضيفي رقم التواصل لاحقًا')">☏<small>تواصل معنا</small></button><button onclick="toast('تتبع الطلبات يحتاج إعداد نظام الطلبات')">▣<small>طلباتي</small></button><button onclick="toast('الأدوات ستضاف لاحقًا')">⚙<small>الأدوات</small></button></nav><div id="message"></div><script>const catsAr=['شروال وايد ليج سادة','شروال وايد ليج بتصميمات مميزة','بناطيل كلاسيك وايد ليج','هودي أوفر سايز','سويت شيرت سوستة كاملة','سويت شيرت نص سوستة'];const catsEn=['Plain Wide-Leg Pants','Statement Wide-Leg Pants','Classic Wide-Leg Trousers','Oversized Hoodies','Full-Zip Sweatshirts','Half-Zip Sweatshirts'];let lang='ar';let cats=catsAr;const icons=['👖','👖','👖','🧥','🧥','🧥'];let currentGender='حريمي';function render(){document.getElementById('catgrid').innerHTML=cats.map((c,i)=>`<div class="category" onclick="document.getElementById('s${i}').scrollIntoView({behavior:'smooth'})"><div class="symbol">${icons[i]}</div>${c}</div>`).join('');document.getElementById('sections').innerHTML=cats.map((c,i)=>`<section id="s${i}"><div class="secthead"><h3>${c}</h3><a href="#s${i}" onclick="toast('سيتم عرض كل منتجات القسم بعد إضافتها')">${lang==='ar'?'عرض الكل ←':'View all →'}</a></div><div class="productrow">${[1,2,3].map(j=>`<div class="product"><div class="placeholder">${icons[i]}</div><p>${lang==='ar'?'صورة المنتج قريبًا':'Product photo coming soon'}</p></div>`).join('')}</div></section>`).join('')}function gender(el,g){currentGender=g;document.querySelectorAll('.gender button').forEach(b=>b.classList.remove('active'));el.classList.add('active');toast('عرض '+g+' — سيتم تخصيص المنتجات عند إضافتها')}const banners=[['أهلاً بيكي في ROYA STOR','أناقتك تبدأ من هنا ✨'],['عروض ROYA المميزة','تابعي أحدث العروض والخصومات'],['تسوقي أحدث الموديلات','ستايلك على ذوقك ✦']];let b=0;function rotate(){document.getElementById('banner').innerHTML=`<h2>${banners[b][0]}</h2><div>${banners[b][1]}</div>`;document.getElementById('dots').innerHTML=banners.map((_,i)=>`<span class="${i===b?'active':''}"></span>`).join('');b=(b+1)%banners.length}rotate();setInterval(rotate,3000);let r=0;const reviews=['مكان مخصص لتقييمات العملاء الحقيقية قريبًا','هنعرض هنا آراء العملاء بعد موافقتهم على النشر','التقييمات المعروضة لاحقًا ستكون من طلبات حقيقية'];setInterval(()=>{document.getElementById('review').textContent=reviews[++r%reviews.length]},3000);let timer;function toast(t){const m=document.getElementById('message');m.textContent=t;m.style.display='block';clearTimeout(timer);timer=setTimeout(()=>m.style.display='none',2700)}document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.trim();document.querySelectorAll('.category').forEach((c,i)=>c.style.opacity=(!q||cats[i].includes(q))?'1':'.25')});const translations={ar:{shop:'تسوق حسب القسم',reviews:'آراء عملائنا ✦',search:'ابحث عن منتج...',gender:['حريمي','رجالي'],nav:['الرئيسية','السلة','تواصل معنا','طلباتي','الأدوات']},en:{shop:'Shop by category',reviews:'Customer reviews ✦',search:'Search products...',gender:['Women','Men'],nav:['Home','Cart','Contact','My orders','Settings']}};function applyLanguage(){const t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.dir=document.documentElement.dir;document.getElementById('lang').textContent=lang==='ar'?'EN':'عربي';document.getElementById('search').placeholder=t.search;document.querySelector('[data-i18n=shop]').textContent=t.shop;document.querySelector('[data-i18n=reviews]').textContent=t.reviews;document.querySelectorAll('.gender button').forEach((x,i)=>x.textContent=t.gender[i]);document.querySelectorAll('nav small').forEach((x,i)=>x.textContent=t.nav[i]);cats=lang==='ar'?catsAr:catsEn;render();rotateText()}function toggleLanguage(){lang=lang==='ar'?'en':'ar';applyLanguage()}function rotateText(){const slide=(b+banners.length-1)%banners.length;if(lang==='en'){const en=[['Welcome to ROYA','Beauty in every detail'],['The ROYA Edit','Discover our latest collections'],['Elevate your everyday','Modern essentials, timeless style']];document.getElementById('banner').innerHTML=`<h2>${en[slide][0]}</h2><div>${en[slide][1]}</div>`}}const originalRotate=rotate;rotate=function(){originalRotate();rotateText()};applyLanguage();</script><div style="position:fixed;top:68px;left:8px;z-index:99;background:#332b23;color:white;padding:6px 10px;border-radius:12px;font:12px Tahoma">نسخة معاينة فقط — لا تستقبل طلبات</div></body></html>
